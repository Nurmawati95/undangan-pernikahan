<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Galeri Foto — Raka & Nadya</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>body{font-family:'Plus Jakarta Sans',sans-serif}.font-serif{font-family:'Playfair Display',serif}</style>
</head>
<body class="bg-[#FDFBF7] text-stone-800 min-h-screen">
<header class="max-w-3xl mx-auto px-4 pt-8 pb-4 text-center">
  <p class="text-xs tracking-widest uppercase text-stone-500">Undangan Pernikahan Digital</p>
  <h1 class="font-serif text-3xl mt-1">Galeri Foto — Raka &amp; Nadya</h1>
  <p class="text-sm text-stone-500 mt-2">Semua foto tersimpan lokal di <code>assets/</code>, jadi tetap tampil walau link Google kadaluarsa.</p>
  <nav class="mt-4 flex gap-2 justify-center text-sm">
    <a href="/" class="px-4 py-2 rounded-full bg-stone-900 text-white">← Kembali ke Undangan</a>
    <a href="/dokumentasi.html" class="px-4 py-2 rounded-full border border-stone-300">Dokumentasi Desain</a>
  </nav>
</header>
<main class="max-w-3xl mx-auto px-4 pb-12 grid grid-cols-1 sm:grid-cols-2 gap-4">
  <figure class="rounded-2xl overflow-hidden border shadow bg-white">
    <img src="assets/couple.jpg" alt="Foto couple Raka dan Nadya" class="w-full h-80 object-cover"/>
    <figcaption class="p-3 text-sm"><b>Couple</b> — foto pasangan (assets/couple.jpg)</figcaption>
  </figure>
  <figure class="rounded-2xl overflow-hidden border shadow bg-white">
    <img src="assets/groom.jpg" alt="Foto groom Raka" class="w-full h-80 object-cover"/>
    <figcaption class="p-3 text-sm"><b>Groom</b> — Raka (assets/groom.jpg)</figcaption>
  </figure>
  <figure class="rounded-2xl overflow-hidden border shadow bg-white">
    <img src="assets/bride.jpg" alt="Foto bride Nadya" class="w-full h-80 object-cover"/>
    <figcaption class="p-3 text-sm"><b>Bride</b> — Nadya (assets/bride.jpg)</figcaption>
  </figure>
  <figure class="rounded-2xl overflow-hidden border shadow bg-white">
    <img src="assets/preview.png" alt="Preview desain undangan" class="w-full h-80 object-cover object-top"/>
    <figcaption class="p-3 text-sm"><b>Preview</b> — screenshot desain (assets/preview.png)</figcaption>
  </figure>
</main>
</body>
</html>
